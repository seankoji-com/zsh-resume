name: ShellSpec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint zsh sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Syntax check zsh sources
        run: |
          for file in $(find . -name '*.zsh' -o -name '*.plugin.zsh'); do
            zsh -n "$file" || exit 1
          done

  shellspec:
    uses: seankoji-com/.github/.github/workflows/reusable-shellspec.yml@main
